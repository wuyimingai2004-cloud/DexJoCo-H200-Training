# Motus Data Factory 内置默认值。
#
# 本文件随 motus_data 包一起分发（pip 安装或直接拷贝目录均可），
# releases.py 在 import 时加载。修改默认值请编辑本文件，不要改代码。
#
# default_catalog_root: 未显式传入 catalog_root= 时使用的 Catalog 根目录。
# releases: 已冻结的数据集 release 注册表，字段对应 EpisodeDatasetRelease。

default_catalog_root: /data/jiyuan.wang/EpisodeCatalogs

releases:
  - dataset: egoscale_second1700h_batch02
    release: 20260821_full_v1
    catalog_path: _20260821/egoscale_second1700h_batch02_full_v1/egoscale_second1700h_batch02.full.20260821_full_v1.episode_catalog.jsonl
    index_path: _20260821/egoscale_second1700h_batch02_full_v1/egoscale_second1700h_batch02.full.20260821_full_v1.episode_catalog.index.sqlite
    default_video_size: [480, 640]
    default_num_workers: 0
    default_queue_size: 2
    action_magnitude_guard_threshold: null
    reader_options:
      egoscale:
        camera_mode: base_0
        pose_profile: world_pose_with_validity
        resize_mode: pad
    default: true

